***REMOVED*** compose.vps.yml — VPS production overrides: minimal RAG runtime profile gating.
***REMOVED*** Usage: COMPOSE_FILE=compose.yml:compose.vps.yml docker compose up -d

services:
  bge-m3:
    read_only: true
    tmpfs:
      - /tmp

  bot:
    ***REMOVED*** Do not copy the dev-only profiles here: bot is part of the default
    ***REMOVED*** VPS RAG chatbot core.
    environment:
      RERANK_PROVIDER: "colbert"
      RERANK_CANDIDATES_MAX: "3"
      LANGFUSE_HOST: ${LANGFUSE_DOCKER_HOST:-}

  litellm:
    ***REMOVED*** Do not copy the dev-only profiles here: litellm is part of the default
    ***REMOVED*** VPS RAG chatbot core.
    environment:
      LANGFUSE_HOST: ${LANGFUSE_DOCKER_HOST:-}
      LANGFUSE_OTEL_HOST: ${LANGFUSE_DOCKER_HOST:-}

  docling:
    profiles: ["vps-noncore"]

  mini-app-api:
    profiles: ["vps-noncore"]

  mini-app-frontend:
    profiles: ["vps-noncore"]

  ingestion:
    profiles: ["vps-noncore", "ingest", "full"]

  clickhouse:
    profiles: ["vps-noncore"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}

  minio:
    profiles: ["vps-noncore"]
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}

  redis-langfuse:
    profiles: ["vps-noncore"]
    environment:
      LANGFUSE_REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:-}

  langfuse-worker:
    profiles: ["vps-noncore"]
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      SALT: ${SALT:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}

  langfuse:
    profiles: ["vps-noncore"]
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      SALT: ${SALT:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
