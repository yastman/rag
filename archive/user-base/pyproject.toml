[project]
name = "user-base-api"
version = "1.0.0"
description = "Russian semantic cache embeddings (deepvk/USER2-base)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sentence-transformers>=3.2.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "langfuse>=4.0.0,<5.0",
    # OTEL auto-instrumentation (#2225) — same SDK-native package set as
    # services/bge-m3-api so HTTP server spans and (future) outbound HTTP
    # client spans nest under @observe spans automatically.
    "opentelemetry-api>=1.39.0",
    "opentelemetry-instrumentation-fastapi>=0.58b0",
    "opentelemetry-instrumentation-httpx>=0.58b0",
    "opentelemetry-instrumentation-logging>=0.58b0",
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.18.0",
    "optimum>=1.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
