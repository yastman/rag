# Bug class registry
# Used by swarm-acceptance and validate_pr_guardrails.py for anti-regression contract.
# Add entries as bug classes are identified in PRs.
#
# Format:
#   - id: <slug>
#     description: <short description>
#     canonical_issue: <#number>
#     guardrail: <test file or contract that prevents recurrence>
#
# Example:
#   - id: stale-cache-hit
#     description: Redis cache returns stale embedding on schema change
#     canonical_issue: "#1234"
#     guardrail: tests/contract/test_cache_invalidation.py

bug_classes:
  - id: tech-debt/archival
    description: Non-core surfaces moved to archive/ to reduce active repo footprint
    canonical_issue: "#2596"
    guardrail: "no langchain import under src/; mini_app only under archive/; no k8s/ at repo root"

  - id: cache-key-missing-retrieval-config
    description: Search-results cache key omitted retrieval config (top_k, collection, mode), causing different configs to collide on the same cached entry
    canonical_issue: "#2618"
    guardrail: "tests/unit/integrations/test_cache_layers.py::TestSearchCacheKeyRetrieval"

  - id: perf/docling-full-file-read
    description: DoclingClient read_bytes() loads entire document into memory before multipart upload
    canonical_issue: "#2622"
    guardrail: "tests/unit/ingestion/test_docling_client_streaming.py"

  - id: perf/dynamic-import-hotpath
    description: Filesystem dynamic import (spec_from_file_location/exec_module) used in RAG hot-path, bypassing module cache and type identity
    canonical_issue: "#2620"
    guardrail: tests/contract/test_no_dynamic_import_in_runtime_hotpath_contract.py

  - id: apscheduler-missing-extra
    description: apscheduler imported at module level without scheduling extra causing ImportError at startup — resolved by archiving nurturing_scheduler/session_summary_worker and dropping apscheduler dep (#2602)
    canonical_issue: "#2617"
    guardrail: tests/unit/services/test_redis_monitor_asyncio.py, tests/unit/test_bot_polling_lock_asyncio.py

  - id: test-debt/langchain-core-import
    description: Kept tests imported langchain / langchain_core directly after the runtime migration off LangChain, coupling the test environment to an undeclared package
    canonical_issue: "#2619"
    guardrail: tests/contract/test_no_langchain_import_outside_archive_contract.py

  - id: duplicate-stale-code
    description: Post-ARCH simplification left duplicate implementations (identical files, parallel graph paths, or dead modules) in the codebase alongside the canonical src/ paths
    canonical_issue: "#2711"
    guardrail: tests/contract/test_duplicate_stale_paths_contract.py
  - id: test-coverage-drift
    description: Test files reference removed or renamed modules/symbols (deleted CRM states, removed function params, archived packages), causing collection errors or silent dead coverage
    canonical_issue: "#2718"
    guardrail: "stale tests skipped with pytest.mark.skip(reason='stale: ...') or deleted if entirely orphaned; import errors resolved"
  - id: stale-post-arch-simplification
    description: Registered handlers or endpoints that reference archived infrastructure (voice, Mini App, legacy API) remain reachable after architectural simplification, creating dead surface area
    canonical_issue: "#2709"
    guardrail: "tests/unit/handlers/test_command_handlers.py — /call handler returns early when livekit not configured"
    description: Stale references (docs, Makefile, config fields, env vars) to services removed during ARCH simplification remain in the active runtime surface
    canonical_issue: "#2684"
    guardrail: "compose config validates; make test-core passes; no user-base in REMOTE_CORE_SERVICES, config.py, or runtime docs"

  - id: cache-key-missing-scope
    description: history_search cache key omitted deal_id scope, causing different deals/contexts to share cached search results
    canonical_issue: "#2945"
    guardrail: tests/unit/agents/test_history_tool.py::test_different_deal_ids_produce_different_cache_scopes
  - id: silent-exception-swallow
    description: Exception handlers use contextlib.suppress(Exception) or bare except without logging or user feedback, silently hiding errors from users and operators
    canonical_issue: "#2950"
    guardrail: "tests/unit/dialogs/test_filter_dialog.py::TestOnApply::test_search_error_is_surfaced_not_swallowed"
  - id: dead-code-silent-disable
    description: HITL confirmation path (_send_hitl_confirmation + agents/hitl.py) had no live callers after #2843 stubbed handle_hitl_callback; dead code remained silently in the codebase
    canonical_issue: "#2943"
    guardrail: "telegram_bot/agents/hitl.py deleted; _send_hitl_confirmation removed from bot.py"

  - id: silent-no-op-with-success-log
    description: Function silently returns a no-op/stub implementation while logging a success message, hiding that the intended feature is disabled or broken
    canonical_issue: "#2944"
    guardrail: tests/unit/integrations/test_memory_checkpointer.py
