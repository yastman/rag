# Bug class registry
# Used by swarm-acceptance and validate_pr_guardrails.py for anti-regression contract.
# Add entries as bug classes are identified in PRs.
#
# Format:
#   - id: <slug>
#     description: <short description>
#     canonical_issue: <#number>
#     guardrail: <test file or contract that prevents recurrence>
#
# Example:
#   - id: stale-cache-hit
#     description: Redis cache returns stale embedding on schema change
#     canonical_issue: "#1234"
#     guardrail: tests/contract/test_cache_invalidation.py

bug_classes:
  - id: tech-debt/archival
    description: Non-core surfaces moved to archive/ to reduce active repo footprint
    canonical_issue: "#2596"
    guardrail: "no langchain import under src/; mini_app only under archive/; no k8s/ at repo root"

  - id: cache-key-missing-retrieval-config
    description: Search-results cache key omitted retrieval config (top_k, collection, mode), causing different configs to collide on the same cached entry
    canonical_issue: "#2618"
    guardrail: "tests/unit/integrations/test_cache_layers.py::TestSearchCacheKeyRetrieval"

  - id: perf/docling-full-file-read
    description: DoclingClient read_bytes() loads entire document into memory before multipart upload
    canonical_issue: "#2622"
    guardrail: "tests/unit/ingestion/test_docling_client_streaming.py"

  - id: perf/dynamic-import-hotpath
    description: Filesystem dynamic import (spec_from_file_location/exec_module) used in RAG hot-path, bypassing module cache and type identity
    canonical_issue: "#2620"
    guardrail: tests/contract/test_no_dynamic_import_in_runtime_hotpath_contract.py

  - id: apscheduler-missing-extra
    description: apscheduler imported at module level without scheduling extra causing ImportError at startup — resolved by archiving nurturing_scheduler/session_summary_worker and dropping apscheduler dep (#2602)
    canonical_issue: "#2617"
    guardrail: tests/unit/services/test_redis_monitor_asyncio.py, tests/unit/test_bot_polling_lock_asyncio.py
