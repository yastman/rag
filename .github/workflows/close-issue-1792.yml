name: Close Issue 1792

on:
  push:
    branches:
      - fix/issue-1792-pin-python-312-makefile

jobs:
  close-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post comment on issue 1792
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1792,
              body: "Closed by PR #1820. TDD: RED→contract `tests/contract/test_makefile_python_version_contract.py` (3 failed — no PYTHON_VERSION pin, bare uv run pytest). GREEN→added `PYTHON_VERSION ?= 3.12`, all 7 fast targets use `uv run --python $(PYTHON_VERSION) pytest`. 29 passed."
            });

      - name: Close issue 1792
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1792,
              state: "closed",
              state_reason: "completed"
            });
