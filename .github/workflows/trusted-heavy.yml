name: Trusted Heavy Checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Trusted Heavy Path Filter
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.filter.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect heavy-test paths
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$changed_files"

          run_heavy=false
          while IFS= read -r path; do
            case "$path" in
              src/*|telegram_bot/*|mini_app/*|services/*|tests/*|compose*.yml|Makefile|pyproject.toml|uv.lock|.github/workflows/*)
                run_heavy=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"

  fast-tests:
    name: Fast Tests
    needs: changes
    if: >
      needs.changes.outputs.run_heavy == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Create Python 3.12 virtualenv
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run fast tests
        run: make test

  heavy-contract-tests-shadow:
    name: Heavy Contract Tests (shadow)
    needs: changes
    continue-on-error: true
    if: >
      needs.changes.outputs.run_heavy == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Create Python 3.12 virtualenv
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run contract tests in shadow mode
        continue-on-error: true
        run: make test-contract
