name: Trusted Heavy Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: trusted-heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Trusted Heavy Path Filter
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.filter.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect heavy-test paths
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$changed_files"

          run_heavy=false
          while IFS= read -r path; do
            case "$path" in
              src/*|telegram_bot/*|services/*|tests/*|compose*.yml|Makefile|pyproject.toml|uv.lock|.github/workflows/*)
                run_heavy=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"

  fast-tests:
    name: Fast Tests
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Create Python 3.12 virtualenv
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compile repo Python files (#2320)
        run: make compile-python

      - name: Run fast tests
        run: make test

      - name: Run fast tests with coverage gate
        # cov-fail-under ratcheted to 9 — safe floor below measured 9.80% combined
        # baseline (card_d880b32250dc / docs/audits/coverage-baseline.md).
        # Run only on src/core + src/runtime (the units exercised by the fast suite).
        # Raise the ratchet as coverage grows; do NOT set to aspirational 80.
        run: >
          PYTHONPATH=scripts/covfix
          uv run pytest tests/unit/ tests/core/ tests/runtime/
          --ignore=tests/unit/telegram_bot
          -n auto --dist=worksteal
          -q --timeout=30
          -m "not legacy_api and not requires_extras and not slow"
          --cov=src --cov=telegram_bot
          --cov-report=term-missing
          --cov-fail-under=9

  heavy-contract-tests:
    name: Heavy Contract Tests
    needs: changes
    if: needs.changes.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Create Python 3.12 virtualenv
        run: uv venv --python 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run contract tests
        run: make test-contract
