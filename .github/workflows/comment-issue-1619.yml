name: Comment and close issue 1619

on:
  push:
    branches:
      - action/comment-issue-1619

jobs:
  comment-and-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Post the required comment on issue #1619
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1619,
              body: `Closed by PR #1816.\n\nTDD: RED → contract \`tests/contract/test_smoke_test_real_module_contract.py\` (3 failed — unit-test redeclared placeholder copies of \`SMOKE_QUERIES\`/\`SLO_THRESHOLDS\`). GREEN → \`tests/unit/evaluation/test_smoke_test.py\` rewritten to import from \`src.evaluation.smoke_test\`; offline \`run_smoke_test\` coverage via monkeypatch fake engines; \`sys.path.insert\` hack replaced with try/except. 190 passed.`
            });
            console.log('Comment posted on issue #1619');

            // Ensure issue is closed (it may already be closed)
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1619,
              state: 'closed'
            });
            console.log('Issue #1619 is closed');
