name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Run project Semgrep guardrails
        run: >
          uvx --from semgrep==1.163.0 semgrep scan
          --config .semgrep/project-guardrails.yml
          --error
          --metrics=off
          src
          telegram_bot
          scripts
          services
          .github/workflows
          compose.yml
          compose.dev.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Ruff lint
        run: uvx --from ruff==0.16.6 ruff check src/ telegram_bot/ services/ scripts/ --output-format=github

      - name: Ruff format check
        run: uvx --from ruff==0.16.6 ruff format --target-version py312 --check src/ telegram_bot/ services/ scripts/

  actionlint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install development tools
        run: uv sync --frozen --group dev

      - name: Validate GitHub Actions workflows
        run: uv run --frozen pre-commit run actionlint --all-files --hook-stage pre-push

  uv-lock:
    name: Lockfile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Verify lockfile integrity
        run: uv lock --locked

  compose-config:
    name: Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Compose config
        run: >
          docker compose
          --env-file tests/fixtures/compose.ci.env
          -f compose.yml
          -f compose.dev.yml
          config --quiet

  cve-scan:
    name: CVE Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Refresh OSV advisory cache (audit-deps-refresh)
        run: uvx pip-audit -s osv --progress-spinner off . > /dev/null 2>&1 || true

      - name: CVE gate (critical/high, severity-filtered)
        run: uv run --frozen python scripts/ci/cve_gate.py

  candidate:
    # #3327: deterministic type/unit candidate coverage for required checks.
    # Mirrors the local `make test-core` + `make test-no-service-lane` lanes
    # and the candidate mypy scope. The contract suite joins this job once
    # #3437 (env ownership) lands via #3328; it is intentionally not required
    # while it still carries that known red pair.
    name: Candidate Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install frozen environment
        run: uv sync --frozen

      - name: MyPy type check
        run: >
          uv run --no-sync mypy src/ telegram_bot/ services/ scripts/
          --ignore-missing-imports --no-error-summary

      - name: Monolith core tests
        run: >
          uv run --no-sync pytest
          tests/unit/core/
          tests/unit/runtime/
          tests/regression/
          tests/characterization/
          tests/contract/test_runtime_no_telegram_bot_coupling_contract.py
          tests/contract/test_layering_no_telegram_bot_imports_contract.py
          --ignore=tests/unit/core/test_pipeline.py
          -q --timeout=30 -m "not requires_extras and not slow"

      - name: No-service integration/smoke lane
        run: >
          uv run --no-sync pytest tests/integration tests/smoke
          -q --timeout=30 -m "no_services and not requires_extras and not slow"
