name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          download-from-astral-mirror: false

      - name: Ruff lint
        run: uvx --from ruff==0.16.6 ruff check src/ telegram_bot/ services/ scripts/ --output-format=github

      - name: Ruff format check
        run: uvx --from ruff==0.16.6 ruff format --target-version py312 --check src/ telegram_bot/ services/ scripts/

  actionlint:
    name: GitHub Actions Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          download-from-astral-mirror: false

      - name: Install development tools
        run: uv sync --frozen --group dev

      - name: Validate GitHub Actions workflows
        run: uv run --frozen pre-commit run actionlint --all-files --hook-stage pre-push

  uv-lock:
    name: Lockfile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          download-from-astral-mirror: false

      - name: Verify lockfile integrity
        run: uv lock --locked

  compose-config:
    name: Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose config
        run: >
          docker compose
          --env-file tests/fixtures/compose.ci.env
          -f compose.yml
          -f compose.dev.yml
          config --quiet

  cve-scan:
    name: CVE Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          download-from-astral-mirror: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Refresh OSV advisory cache
        run: uvx pip-audit -s osv --progress-spinner off . > /dev/null 2>&1 || true

      - name: CVE gate (critical/high, severity-filtered)
        run: uv run --frozen python scripts/ci/cve_gate.py

  candidate:
    # Mirrors local core, no-service and deterministic contract lanes (#3328),
    # including native environment ownership (#3437), plus candidate MyPy scope.
    name: Candidate Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          prune-cache: true
          download-from-astral-mirror: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install frozen environment
        run: uv sync --frozen

      - name: MyPy type check
        run: >
          uv run --no-sync mypy src/ telegram_bot/ services/ scripts/
          --ignore-missing-imports --no-error-summary

      - name: Import-linter architecture checks
        run: uv run --no-sync lint-imports

      - name: Monolith core tests
        run: >
          uv run --no-sync pytest
          tests/unit/core/
          tests/unit/runtime/
          tests/regression/
          tests/characterization/
          tests/contract/test_runtime_no_telegram_bot_coupling_contract.py
          --ignore=tests/unit/core/test_pipeline.py
          -q --timeout=30 -m "not requires_extras and not slow"

      - name: No-service integration/smoke lane
        run: >
          uv run --no-sync pytest tests/integration tests/smoke
          -q --timeout=30 -m "no_services and not requires_extras and not slow"

      - name: Deterministic contract suite
        run: >
          uv run --no-sync pytest tests/contract/ -n auto --dist=worksteal
          -q --timeout=30 -m "not requires_extras"
