rules:
  - id: python.no-datetime-utcnow
    message: Use timezone-aware datetime.now(UTC) instead of naive UTC constructors.
    severity: ERROR
    languages:
      - python
    pattern-either:
      - pattern: $X.utcnow(...)
      - pattern: $X.utcfromtimestamp(...)
    paths:
      include:
        - /scripts/**
        - /src/**
        - /telegram_bot/**
        - /mini_app/**
        - /services/**

  - id: python.no-instructor-from-provider
    message: Use instructor.from_openai(langfuse.openai.AsyncOpenAI(...)); from_provider builds its own client and breaks Langfuse auto-tracing.
    severity: ERROR
    languages:
      - python
    pattern: instructor.from_provider(...)
    paths:
      include:
        - /src/**
        - /telegram_bot/**
        - /mini_app/**

  - id: python.no-langfuse-set-current-trace-io
    message: Langfuse set_current_trace_io is deprecated; update the current span/observation instead.
    severity: ERROR
    languages:
      - python
    pattern: $CLIENT.set_current_trace_io(...)
    paths:
      include:
        - /src/**
        - /telegram_bot/**
        - /scripts/**

  - id: python.no-langfuse-prompts-api-get
    message: Use Langfuse client.get_prompt(...) through the project prompt manager; do not probe client.api.prompts.get(...).
    severity: ERROR
    languages:
      - python
    pattern: $CLIENT.api.prompts.get(...)
    paths:
      include:
        - /src/**
        - /telegram_bot/**
        - /scripts/**

  - id: python.no-qdrant-client-search
    message: Qdrant client.search(...) is deprecated; use query_points(...).
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern: $CLIENT.search(...)
      - metavariable-regex:
          metavariable: $CLIENT
          regex: '(?i).*(client|qdrant).*'
    paths:
      include:
        - /src/ingestion/unified/qdrant_writer.py
        - /telegram_bot/services/apartments_service.py
        - /telegram_bot/services/qdrant.py
        - /src/retrieval/search_engines.py
        - /src/evaluation/search_engines.py

  - id: python.no-subprocess-shell-true
    message: Avoid subprocess shell=True; pass an argv list with shell=False.
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
    paths:
      include:
        - /src/**
        - /telegram_bot/**
        - /scripts/**

  - id: python.no-os-system
    message: Avoid os.system/os.popen; use subprocess.run with an argv list.
    severity: ERROR
    languages:
      - python
    pattern-either:
      - pattern: os.system(...)
      - pattern: os.popen(...)
    paths:
      include:
        - /src/**
        - /telegram_bot/**
        - /scripts/**

  - id: github-actions.no-pull-request-target
    message: Avoid pull_request_target workflows unless a dedicated security review approves them.
    severity: ERROR
    languages:
      - yaml
    pattern-regex: '^\s*pull_request_target\s*:'
    paths:
      include:
        - /.github/workflows/*.yml
        - /.github/workflows/*.yaml

  - id: compose.no-latest-image
    message: Compose images must not use the mutable :latest tag.
    severity: ERROR
    languages:
      - yaml
    pattern-regex: '^\s*image\s*:\s*["'']?[^"''\s#]+:latest(?:@sha256:[a-fA-F0-9]+)?["'']?\s*(?:#.*)?$'
    paths:
      include:
        - /compose.yml
        - /compose.*.yml
