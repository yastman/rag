# Base configuration — all services, no ports exposed.
# Use with override: COMPOSE_FILE=compose.yml:compose.dev.yml
# See DOCKER.md and docs/LOCAL-DEVELOPMENT.md

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security-defaults: &security-defaults
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs:
    - /tmp

services:
  # =============================================================================
  # DATABASES
  # =============================================================================

  postgres:
    <<: *security-defaults
    image: pgvector/pgvector:pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: false
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    <<: *security-defaults
    image: redis:8.6.3@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
    # Match the redis user (uid 999) baked into redis:8.x so the process can
    # read/write /data with cap_drop:[ALL]. Running as root without
    # CAP_DAC_OVERRIDE cannot read redis-owned dump.rdb and causes startup loops.
    user: "999:999"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: false
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy volatile-lfu
      --maxmemory-samples 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 300M

  qdrant:
    <<: *security-defaults
    image: qdrant/qdrant:v1.18.1@sha256:45f8e3ddc2570a4d029877e1b5ec1045c19b3852b4e22a55c7f43b05aea0ca89
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: false
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage
      # Storage optimisation config — fixes #1545 (3.1 GB unbounded growth).
      # Qdrant loads /qdrant/config/production.yaml on start when present.
      - ./docker/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  # =============================================================================
  # AI SERVICES
  # =============================================================================

  bge-m3:
    <<: *security-defaults
    image: "${COMPOSE_PROJECT_NAME:-dev}_bge-m3"
    build:
      context: ./services/bge-m3-api
      dockerfile: Dockerfile
      additional_contexts:
        bge_m3_onnx_model: "${BGE_M3_ONNX_MODEL_HOST_DIR:?BGE_M3_ONNX_MODEL_HOST_DIR must point to the local ONNX model directory}"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - hf_cache:/models/hf
    environment:
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
      HF_HOME: /models/hf
      TRANSFORMERS_CACHE: /models/hf
      MODEL_CACHE_DIR: /models/hf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold-start model download can take several minutes on first run.
      start_period: 420s
    deploy:
      resources:
        limits:
          memory: ${BGE_M3_MEMORY_LIMIT:-4G}
          pids: 200

  docling:
    <<: *security-defaults
    image: "${COMPOSE_PROJECT_NAME:-dev}_docling"
    build:
      context: ./services/docling
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Docling writes temporary files and HuggingFace caches at runtime.
    # Keep hardening defaults, but allow writes for this service.
    read_only: false
    environment:
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 5001
      DOCLING_BACKEND: docling
      DOCLING_PDF_BACKEND: dlparse_v2
      DOCLING_TABLE_MODE: accurate
    volumes:
      - ./data/docling:/data
      - docling_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 200

  # =============================================================================
  # TELEGRAM BOT
  # =============================================================================

  bot:
    <<: *security-defaults
    image: "${COMPOSE_PROJECT_NAME:-dev}_bot"
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      # Local embeddings (matches VPS production)
      RETRIEVAL_DENSE_PROVIDER: bge_m3_api
      RETRIEVAL_SPARSE_PROVIDER: bge_m3_api
      BGE_M3_URL: http://bge-m3:8000
      BGE_M3_TIMEOUT: "${BGE_M3_TIMEOUT:-120}"
      GENERATE_MAX_TOKENS: "${GENERATE_MAX_TOKENS:-2048}"
      RERANK_CANDIDATES_MAX: "${RERANK_CANDIDATES_MAX:-10}"
      # Semantic cache
      USE_LOCAL_EMBEDDINGS: "true"
      # Services
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-gdrive_documents_bge}
      # LLM (LiteLLM Python SDK router)
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-${LLM_API_KEY:-}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: gpt-4o-mini
      # Latency knobs
      MAX_REWRITE_ATTEMPTS: "${MAX_REWRITE_ATTEMPTS:-1}"
      REWRITE_MAX_TOKENS: "${REWRITE_MAX_TOKENS:-64}"
      # Pipeline mode
      CLIENT_DIRECT_PIPELINE_ENABLED: "${CLIENT_DIRECT_PIPELINE_ENABLED:-false}"
      # Domain configuration
      BOT_DOMAIN: ${BOT_DOMAIN:-недвижимость}
      BOT_LANGUAGE: ${BOT_LANGUAGE:-ru}
      # Manager
      MANAGER_IDS: "${MANAGER_IDS:-}"
      MANAGERS_GROUP_ID: "${MANAGERS_GROUP_ID:-}"
      HANDOFF_ENABLED: "${HANDOFF_ENABLED:-false}"
      HANDOFF_TTL_HOURS: "${HANDOFF_TTL_HOURS:-72}"
      HANDOFF_SUMMARY_MIN_MESSAGES: "${HANDOFF_SUMMARY_MIN_MESSAGES:-3}"
      BUSINESS_HOURS_START: "${BUSINESS_HOURS_START:-9}"
      BUSINESS_HOURS_END: "${BUSINESS_HOURS_END:-18}"
      BUSINESS_HOURS_TZ: "${BUSINESS_HOURS_TZ:-Europe/Sofia}"
      HANDOFF_WAIT_TIMEOUT_MIN: "${HANDOFF_WAIT_TIMEOUT_MIN:-15}"
      # Real Estate DB
      REALESTATE_DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/realestate"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      bge-m3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'telegram_bot.main' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 100

  # =============================================================================
  # UNIFIED INGESTION PIPELINE (v3.2.1)
  # =============================================================================

  ingestion:
    <<: *security-defaults
    image: "${COMPOSE_PROJECT_NAME:-dev}_ingestion"
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    profiles: ["ingest", "full"]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      - GDRIVE_SYNC_DIR=/data/drive-sync
      - INGESTION_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/cocoindex
      - QDRANT_URL=http://qdrant:6333
      - DOCLING_URL=http://docling:5001
      - GDRIVE_COLLECTION_NAME=gdrive_documents_bge
      # Local embeddings (matches VPS production)
      - USE_LOCAL_DENSE_EMBEDDINGS=true
      - BGE_M3_URL=http://bge-m3:8000
      - BGE_M3_TIMEOUT=600
      - BGE_M3_CONCURRENCY=1
      - MANIFEST_DIR=/data/manifest
    volumes:
      - type: bind
        source: ${GDRIVE_SYNC_DIR:?GDRIVE_SYNC_DIR is required}
        target: /data/drive-sync
        read_only: true
        bind:
          create_host_path: false
      - ingestion-manifest:/data/manifest
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      docling:
        condition: service_healthy
      bge-m3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'src.ingestion.unified.cli' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # =============================================================================
  # ML PLATFORM (Langfuse stack — always-on on VPS, profile-gated on dev via override)
  # =============================================================================

  # ClickHouse for Langfuse v3 analytics
  clickhouse:
    <<: *security-defaults
    profiles: ["ml", "full"]
    image: clickhouse/clickhouse-server:26.5.1@sha256:07afc18d8a9706eb9d85c5c5d2752e5270f91bbc2894caeaecb73e4d0f603bf5
    # Official ClickHouse entrypoint chowns /var/lib/clickhouse and drops to
    # the clickhouse user. Keep cap_drop:[ALL] but restore only these startup
    # capabilities so named volumes can boot.
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: false
    logging: *default-logging
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1536M

  # MinIO S3-compatible storage for Langfuse v3
  minio:
    <<: *security-defaults
    profiles: ["ml", "full"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    read_only: false
    logging: *default-logging
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  # Redis for Langfuse v3 (separate from app Redis)
  redis-langfuse:
    <<: *security-defaults
    profiles: ["ml", "full"]
    image: redis:8.6.3@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
    # Match the redis user (uid 999) baked into redis:8.x so the process can
    # write /data with cap_drop:[ALL] (no CAP_DAC_OVERRIDE/CAP_FOWNER to bypass
    # the redis-owned volume).
    # See issue #2186.
    user: "999:999"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: false
    logging: *default-logging
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "${LANGFUSE_REDIS_PASSWORD:-}" ]; then
          exec redis-server --requirepass "$LANGFUSE_REDIS_PASSWORD"
        fi
        exec redis-server
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "${LANGFUSE_REDIS_PASSWORD+x}" ] && [ -n "$LANGFUSE_REDIS_PASSWORD" ]; then
            redis-cli -a "$LANGFUSE_REDIS_PASSWORD" ping | grep -q PONG
          else
            redis-cli ping | grep -q PONG
          fi
      interval: 5s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # Langfuse v3 Worker
  langfuse-worker:
    profiles: ["ml", "full"]
    image: langfuse/langfuse-worker:3.175.0@sha256:cf7ac3d5d29bce3d2f4626d5b3231665c5585a81599b5f54fd8e30f648874403
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
        restart: true
      redis-langfuse:
        condition: service_healthy
        restart: true
      clickhouse:
        condition: service_healthy
        restart: true
    environment: &langfuse-env
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/langfuse
      # Auth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      SALT: ${SALT:?SALT is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      # ClickHouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      # S3/MinIO
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      # Redis
      REDIS_HOST: redis-langfuse
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-}
      # Telemetry
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'langfuse-worker' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # Langfuse v3 Web
  langfuse:
    profiles: ["ml", "full"]
    image: langfuse/langfuse:3.175.0@sha256:45c0fb329106da48ebffcfc17a5a7f585bb5bfb94c44125add7bdd19a440ed9b
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      minio:
        condition: service_healthy
        restart: true
      redis-langfuse:
        condition: service_healthy
        restart: true
      clickhouse:
        condition: service_healthy
        restart: true
      langfuse-worker:
        condition: service_started
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  # loki, promtail, alertmanager archived — see archive/obs/

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  hf_cache:
  docling_cache:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  ingestion-manifest:
  langfuse_redis_data:
