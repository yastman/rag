# Base configuration — all services, no ports exposed.
# Use with override: docker compose -f compose.yml -f compose.dev.yml up -d
# See DOCKER.md and docs/LOCAL-DEVELOPMENT.md

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security-defaults: &security-defaults
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs:
    - /tmp

services:
  # =============================================================================
  # DATABASES
  # =============================================================================

  postgres:
    # Opt-in domain database (#3241): bookmarks/user features are an optional
    # capability, so PostgreSQL is NOT part of the core demo topology. Start it
    # explicitly with `docker compose --profile postgres up -d` or via `full`.
    <<: *security-defaults
    profiles: ["postgres", "full"]
    image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: false
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    <<: *security-defaults
    image: redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    # Match the redis user (uid 999) baked into redis:8.x so the process can
    # read/write /data with cap_drop:[ALL]. Running as root without
    # CAP_DAC_OVERRIDE cannot read redis-owned dump.rdb and causes startup loops.
    user: "999:999"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: false
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy volatile-lfu
      --maxmemory-samples 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 300M

  qdrant:
    <<: *security-defaults
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: false
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage
      # Storage optimisation config — fixes #1545 (3.1 GB unbounded growth).
      # Qdrant loads /qdrant/config/production.yaml on start when present.
      - ./docker/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  # =============================================================================
  # AI SERVICES
  # =============================================================================

  bge-m3:
    <<: *security-defaults
    image: "${COMPOSE_PROJECT_NAME:-dev}_bge-m3"
    build:
      context: ./services/bge-m3-api
      dockerfile: Dockerfile
      additional_contexts:
        bge_m3_onnx_model: "${BGE_M3_ONNX_MODEL_HOST_DIR:?BGE_M3_ONNX_MODEL_HOST_DIR must point to the local ONNX model directory}"
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - hf_cache:/models/hf
    environment:
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
      HF_HOME: /models/hf
      TRANSFORMERS_CACHE: /models/hf
      MODEL_CACHE_DIR: /models/hf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold-start model download can take several minutes on first run.
      start_period: 420s
    deploy:
      resources:
        limits:
          memory: ${BGE_M3_MEMORY_LIMIT:-4G}
          pids: 200

  # =============================================================================
  # TELEGRAM BOT
  # =============================================================================

  bot:
    <<: *security-defaults
    image: "${COMPOSE_PROJECT_NAME:-dev}_bot"
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Local embeddings (matches VPS production)
      BGE_M3_URL: http://bge-m3:8000
      BGE_M3_TIMEOUT: "${BGE_M3_TIMEOUT:-120}"
      GENERATE_MAX_TOKENS: "${GENERATE_MAX_TOKENS:-2048}"
      # Services
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      # Honest Redis mode (#3354): Compose bot defaults explicitly to
      # single_instance — one process, no distributed polling lock claim.
      # Set REDIS_MODE=multi_instance for scaled deployments (lock required).
      REDIS_MODE: ${REDIS_MODE:-single_instance}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-gdrive_documents_bge}
      # LLM (LiteLLM Python SDK router)
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-${LLM_API_KEY:-}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: gpt-4o-mini
      # Latency knobs
      MAX_REWRITE_ATTEMPTS: "${MAX_REWRITE_ATTEMPTS:-1}"
      REWRITE_MAX_TOKENS: "${REWRITE_MAX_TOKENS:-64}"
      # Domain configuration
      BOT_DOMAIN: ${BOT_DOMAIN:-недвижимость}
      BOT_LANGUAGE: ${BOT_LANGUAGE:-ru}
      # Manager
      MANAGER_IDS: "${MANAGER_IDS:-}"
      MANAGERS_GROUP_ID: "${MANAGERS_GROUP_ID:-}"
      HANDOFF_ENABLED: "${HANDOFF_ENABLED:-false}"
      HANDOFF_TTL_HOURS: "${HANDOFF_TTL_HOURS:-72}"
      HANDOFF_SUMMARY_MIN_MESSAGES: "${HANDOFF_SUMMARY_MIN_MESSAGES:-3}"
      BUSINESS_HOURS_START: "${BUSINESS_HOURS_START:-9}"
      BUSINESS_HOURS_END: "${BUSINESS_HOURS_END:-18}"
      BUSINESS_HOURS_TZ: "${BUSINESS_HOURS_TZ:-Europe/Sofia}"
      # Real Estate DB — optional domain DB (#3241). The bot starts and degrades
      # gracefully (bookmarks capability disabled) when PostgreSQL is absent.
      REALESTATE_DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/realestate"
    depends_on:
      # Full-profile ordering (#3361): required: false keeps PostgreSQL
      # OPTIONAL outside the postgres/full profiles (#3241) — Compose skips
      # the dependency entirely when postgres is not active. When postgres IS
      # active (full stack), the bot waits for a healthy database so the
      # bookmarks capability setup never races a cold PostgreSQL and full
      # fresh-volume starts never come up permanently degraded.
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      bge-m3:
        condition: service_healthy
    healthcheck:
      # Capability-honest health (#3361): process alive AND the CRITICAL
      # dependencies still serving from the bot's network namespace — a bot
      # whose Redis/Qdrant/BGE-M3 went dark must report unhealthy, not green.
      # PostgreSQL is deliberately not probed: it stays an optional capability
      # (#3241), so a degraded-but-working bot remains healthy.
      test: ["CMD-SHELL", "pgrep -f 'telegram_bot.main' >/dev/null || exit 1; python -c \"import httpx, socket; c = httpx.Client(timeout=5); q = c.get('http://qdrant:6333/readyz'); b = c.get('http://bge-m3:8000/health'); c.close(); s = socket.create_connection(('redis', 6379), timeout=5); s.close(); exit(0 if q.status_code == 200 and b.status_code == 200 else 1)\""]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 100

  # =============================================================================
  # UNIFIED INGESTION PIPELINE (v3.2.1)
  # =============================================================================

  ingestion:
    <<: *security-defaults
    image: "${COMPOSE_PROJECT_NAME:-dev}_ingestion"
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    profiles: ["ingest", "full"]
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    # The image entrypoint starts as root and drops to the fixed non-root
    # `ingestion` user via gosu (setuid/setgid) after chowning the manifest
    # volume. Under cap_drop: [ALL] that switch fails with EPERM and the
    # container crash-loops, so a cold full-profile start can never reach six
    # healthy services (#3361 cold start). Grant exactly what the entrypoint
    # needs; the dropped-to process runs as uid 1000 without them.
    cap_add: ["CHOWN", "SETGID", "SETUID"]
    environment:
      - GDRIVE_SYNC_DIR=/data/drive-sync
      - QDRANT_URL=http://qdrant:6333
      - GDRIVE_COLLECTION_NAME=gdrive_documents_bge
      # Local embeddings (matches VPS production)
      - USE_LOCAL_DENSE_EMBEDDINGS=true
      - BGE_M3_URL=http://bge-m3:8000
      - BGE_M3_TIMEOUT=600
      - BGE_M3_CONCURRENCY=1
      - MANIFEST_DIR=/data/manifest
    volumes:
      - type: bind
        source: ${GDRIVE_SYNC_DIR:-./data/drive-sync-empty}
        target: /data/drive-sync
        read_only: true
        bind:
          create_host_path: true
      - ingestion-manifest:/data/manifest
    depends_on:
      # Qdrant/BGE precede ingestion (#3361): writes and embeddings require
      # both to serve before the pipeline starts polling the sync directory.
      qdrant:
        condition: service_healthy
      bge-m3:
        condition: service_healthy
    healthcheck:
      # Capability-honest health (#3361): process alive AND Qdrant ready AND
      # the BGE-M3 model actually loaded. Cold-start-safe: probes readiness,
      # not collection existence (a fresh volume has no collection until the
      # first ingest), and does not contend with running encode batches.
      test: ["CMD-SHELL", "pgrep -f 'src.ingestion.unified.cli' >/dev/null || exit 1; python -c \"import httpx; c = httpx.Client(timeout=10); q = c.get('http://qdrant:6333/readyz'); b = c.get('http://bge-m3:8000/health'); c.close(); exit(0 if q.status_code == 200 and b.status_code == 200 and b.json().get('model_loaded') is True else 1)\""]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # Langfuse ml stack removed — see #2844

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  hf_cache:
  ingestion-manifest:
