[project]
name = "contextual-rag"
version = "2.14.0"
description = "Contextual RAG Pipeline with DBSF + ColBERT hybrid search"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
    "instructor>=1.7.0",  ***REMOVED*** Structured LLM extraction for apartment filters
    "groq",
    "python-dotenv",
    "pydantic-settings>=2.0.0",  ***REMOVED*** Required by telegram_bot/config.py (BotConfig)
    "cachetools>=5.0.0",  ***REMOVED*** Required by telegram_bot/middlewares/throttling.py
    "numpy",
    "aiohttp",
    "requests",
    "qdrant-client>=1.17.1",  ***REMOVED*** Vector database client (v1.17+ for weighted RRF, relevance feedback)
    "langfuse>=4.0.0,<5.0",  ***REMOVED*** Native v4 observability migration
    ***REMOVED*** Voyage AI Integration (2026-01-21)
    "voyageai>=0.3.0",        ***REMOVED*** Voyage AI embeddings and reranking
    "tenacity>=8.2.0",        ***REMOVED*** Retry logic with exponential backoff
    "redis>=7.1.0",
    "redisvl>=0.16.0",
    "aiogram==3.27.0",
    "aiogram-dialog==2.5.0",            ***REMOVED*** Dialog framework (menus, navigation, widgets)
    "fluentogram>=1.2.0",               ***REMOVED*** i18n (Fluent .ftl files, stub generator)
    "asyncpg>=0.31.0",
    ***REMOVED*** Performance (2026-02-06)
    "uvloop>=0.21.0",                     ***REMOVED*** 2-4x faster asyncio event loop
    ***REMOVED*** LangGraph Pipeline (2026-02-09)
    "langgraph>=1.0.3,<2.0",               ***REMOVED*** State graph for RAG pipeline
    "langchain-core>=1.2",                ***REMOVED*** Core abstractions (Embeddings, etc.)
    "langgraph-checkpoint-postgres>=2.0", ***REMOVED*** Postgres checkpointing for LangGraph
    ***REMOVED*** Conversation memory (***REMOVED***154)
    "langgraph-checkpoint-redis>=0.3.6",  ***REMOVED*** Redis checkpointer for LangGraph (0.3.0 fixes HumanMessage serialization ***REMOVED***128)
    "langmem>=0.0.30",                    ***REMOVED*** SummarizationNode for conversation compression
    ***REMOVED*** Scheduled nurturing + analytics (***REMOVED***390)
    "apscheduler>=3.11.2,<4.0",           ***REMOVED*** Async job scheduling (v3 API)
    "phonenumbers>=9.0.25",
]

[project.optional-dependencies]
***REMOVED*** Local ML models (torch, FlagEmbedding, sentence-transformers)
***REMOVED*** Only needed when running local model inference (BGE-M3, cross-encoder, etc.)
***REMOVED*** Install: uv sync --extra ml-local
ml-local = [
    "FlagEmbedding",
    "scipy",
    "sentence-transformers",
    ***REMOVED*** PyTorch CPU-only (forced via [tool.uv.sources] → pytorch-cpu index)
    "torch>=2.0.0",
    "torchvision>=0.15.0",  ***REMOVED*** Must be direct dep for [tool.uv.sources] to apply CPU index
    "transformers>=4.30.0", ***REMOVED*** For HuggingFace tokenizers in HybridChunker
]

***REMOVED*** Documentation tools
docs = [
    "mkdocs>=1.6.0",         ***REMOVED*** Documentation generator
    "mkdocs-material>=9.5.0",***REMOVED*** Material theme
    "mkdocstrings[python]>=0.25.0",  ***REMOVED*** Auto API docs
]

***REMOVED*** Mini App (Telegram Web App — FastAPI backend)
mini-app = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

***REMOVED*** Voice bot (LiveKit Agents + RAG API)
voice = [
    "livekit-agents[silero,turn-detector]~=1.4",
    "livekit-plugins-elevenlabs~=1.1",
    "livekit-plugins-openai~=1.1",
    "livekit~=1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0",
]

***REMOVED*** Ingestion pipeline (Docling, CocoIndex, PyMuPDF)
ingest = [
    "pymupdf>=1.26.0",
    "docling>=2.70.0",
    "docling-core>=2.61.0",
    "cocoindex>=0.3.28",
    "fastembed>=0.7.4",
]

***REMOVED*** Evaluation tools (RAGAS, dataset generation)
eval = [
    "ragas>=0.4.3",
    "datasets>=3.0.0",
    "pandas>=2.0.0",
]

***REMOVED*** All optional dependencies
all = [
    "contextual-rag[docs,voice,eval,ingest,ml-local]",
]

***REMOVED*** =============================================================================
***REMOVED*** DEPENDENCY GROUPS (PEP 735) — dev tools installed by default with `uv sync`
***REMOVED*** =============================================================================

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pylint>=3.2.0",
    "bandit>=1.7.9",
    "vulture>=2.11",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=1.2.0",
    "pytest-httpx>=0.35.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "click>=8.1.7",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0",
    "pre-commit>=3.8.0",
    "telethon>=1.42.0",
    "pytest-split>=0.11.0",
    "fakeredis>=2.26.0",
]

***REMOVED*** =============================================================================
***REMOVED*** UV: CPU-only PyTorch (no CUDA — VPS has no GPU)
***REMOVED*** SDK pattern from Context7: https://github.com/astral-sh/uv/blob/main/docs/guides/integration/pytorch.md
***REMOVED*** =============================================================================

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

***REMOVED*** =============================================================================
***REMOVED*** RUFF CONFIGURATION (Modern Python Linter + Formatter, 2025)
***REMOVED*** =============================================================================
***REMOVED*** Ruff replaces: flake8, black, isort, pyupgrade, autoflake, and more
***REMOVED*** Speed: 10-100x faster than traditional tools
***REMOVED*** Documentation: https://docs.astral.sh/ruff/

[tool.ruff]
***REMOVED*** Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pycache__",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

***REMOVED*** Line length: 100 (slightly longer than Black's 88 for readability)
line-length = 100
indent-width = 4

***REMOVED*** Target Python 3.9+ (project minimum)
target-version = "py311"

***REMOVED*** =============================================================================
***REMOVED*** LINTING RULES
***REMOVED*** =============================================================================

[tool.ruff.lint]
***REMOVED*** Enable recommended rule sets (2025 best practices)
select = [
    "E",     ***REMOVED*** pycodestyle errors
    "W",     ***REMOVED*** pycodestyle warnings
    "F",     ***REMOVED*** Pyflakes (undefined names, unused imports, etc.)
    "B",     ***REMOVED*** flake8-bugbear (common bugs and design problems)
    "I",     ***REMOVED*** isort (import sorting)
    "UP",    ***REMOVED*** pyupgrade (modernize Python code)
    "SIM",   ***REMOVED*** flake8-simplify (simplify code)
    "C4",    ***REMOVED*** flake8-comprehensions (better list/dict/set comprehensions)
    "PIE",   ***REMOVED*** flake8-pie (misc lints)
    "T20",   ***REMOVED*** flake8-print (detect print statements)
    "RET",   ***REMOVED*** flake8-return (return statement issues)
    "ARG",   ***REMOVED*** flake8-unused-arguments
    "PTH",   ***REMOVED*** flake8-use-pathlib (prefer pathlib over os.path)
    "PERF",  ***REMOVED*** perflint (performance anti-patterns) - NEW 2025
    "RUF",   ***REMOVED*** Ruff-specific rules - NEW 2025
    "FURB",  ***REMOVED*** refurb (modernize Python idioms) - NEW 2025
    "ASYNC", ***REMOVED*** flake8-async (async/await best practices) - NEW 2025
]

***REMOVED*** Ignore specific rules
ignore = [
    "E501",    ***REMOVED*** Line too long (handled by formatter)
    "B008",    ***REMOVED*** Function calls in argument defaults
    "T201",    ***REMOVED*** print() statements (we use them for logging)
    "PTH123",  ***REMOVED*** pathlib open() (we use built-in open())
    "PTH",     ***REMOVED*** os.path usage (pathlib migration not critical for this project)
    "ARG002",  ***REMOVED*** Unused method arguments (often required for interface compatibility)
    "B904",    ***REMOVED*** raise-without-from (context dependent, not always needed)
    "SIM113",  ***REMOVED*** enumerate-for-loop (minor optimization, not critical)
    ***REMOVED*** NEW 2025 rules - selective ignores
    "RUF001",  ***REMOVED*** ambiguous-unicode (false positives for Cyrillic/Ukrainian text)
    "RUF002",  ***REMOVED*** ambiguous-unicode-docstring (false positives for Cyrillic)
    "RUF003",  ***REMOVED*** ambiguous-unicode-comment (false positives for Cyrillic comments)
    "PERF203", ***REMOVED*** try-except-in-loop (acceptable for error handling in async)
    "PERF401", ***REMOVED*** manual-list-comprehension (readability over micro-optimization)
    "RUF012",  ***REMOVED*** mutable-class-default (dataclasses handle this correctly)
    "ASYNC230",***REMOVED*** blocking-open-call (some files are small, async not always needed)
    "ASYNC240",***REMOVED*** blocking-path-call (local filesystem ops are fast, async overhead not worth it)
]

***REMOVED*** Allow auto-fix for all enabled rules
fixable = ["ALL"]
unfixable = []

***REMOVED*** Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

***REMOVED*** Per-file ignores
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]  ***REMOVED*** Allow unused imports and late imports
"evaluation/*.py" = ["T201"]      ***REMOVED*** Allow print() in evaluation scripts
"test_*.py" = ["E402", "T201", "SIM117"]  ***REMOVED*** Allow late imports, print(), nested with in tests
"tests/**/*.py" = ["E402", "T201", "SIM117"]  ***REMOVED*** Same for tests/ directory
"legacy/*.py" = ["ASYNC210"]      ***REMOVED*** Allow blocking HTTP calls in async functions (legacy code)
"src/ingestion/docling_client.py" = ["ASYNC240"]  ***REMOVED*** Legacy ingestion (replaced by unified pipeline)
"src/ingestion/gdrive_flow.py" = ["ASYNC240"]     ***REMOVED*** Legacy ingestion (replaced by unified pipeline)
"src/ingestion/service.py" = ["ASYNC240"]          ***REMOVED*** Legacy ingestion (replaced by unified pipeline)
"*.py" = ["ARG001"]               ***REMOVED*** Allow unused function arguments (common in callbacks)

***REMOVED*** Import sorting configuration (isort replacement)
[tool.ruff.lint.isort]
known-first-party = ["config", "evaluation"]
force-single-line = false
lines-after-imports = 2

***REMOVED*** =============================================================================
***REMOVED*** FORMATTING
***REMOVED*** =============================================================================

[tool.ruff.format]
***REMOVED*** Use double quotes for strings (like Black)
quote-style = "double"

***REMOVED*** Indent with spaces (4 spaces)
indent-style = "space"

***REMOVED*** Respect magic trailing commas
skip-magic-trailing-comma = false

***REMOVED*** Auto-detect line endings (LF on Linux, CRLF on Windows)
line-ending = "auto"

***REMOVED*** Format code examples in docstrings
docstring-code-format = true

***REMOVED*** Docstring code line length (dynamic = same as main code)
docstring-code-line-length = "dynamic"

***REMOVED*** =============================================================================
***REMOVED*** MYPY CONFIGURATION (Type Checking)
***REMOVED*** =============================================================================
***REMOVED*** Uncomment to enable strict type checking
***REMOVED*** Run: mypy .

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  ***REMOVED*** Set to true for strict mode
ignore_missing_imports = true  ***REMOVED*** Ignore missing stubs for now
explicit_package_bases = true  ***REMOVED*** Resolve duplicate module names in services/

[[tool.mypy.overrides]]
module = "FlagEmbedding.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.retrieval.topic_classifier"
disallow_untyped_defs = true

***REMOVED*** =============================================================================
***REMOVED*** BANDIT CONFIGURATION (Security Linting)
***REMOVED*** =============================================================================
***REMOVED*** Uncomment to enable security checks
***REMOVED*** Run: bandit -r . -c pyproject.toml

[tool.bandit]
exclude_dirs = [".venv", "tests", "evaluation", "legacy", "__pycache__"]
skips = ["B101"]  ***REMOVED*** Skip assert_used (common in tests)

***REMOVED*** =============================================================================
***REMOVED*** PYLINT CONFIGURATION (Comprehensive Linting)
***REMOVED*** =============================================================================
***REMOVED*** Run: pylint src/

[tool.pylint.main]
***REMOVED*** Python version for compatibility checks
py-version = "3.11"

***REMOVED*** Files/directories to exclude
ignore = ["legacy", "tests", ".venv", "__pycache__"]
ignore-patterns = [".*_old\\.py$", ".*_backup\\.py$"]

[tool.pylint.messages_control]
***REMOVED*** Disable specific checks
disable = [
    "C0111",  ***REMOVED*** missing-docstring
    "C0103",  ***REMOVED*** invalid-name (sometimes OK for ML code)
    "R0913",  ***REMOVED*** too-many-arguments (common in ML)
    "R0914",  ***REMOVED*** too-many-locals
    "W0511",  ***REMOVED*** fixme/todo comments
    "C0301",  ***REMOVED*** line-too-long (handled by ruff)
]

[tool.pylint.format]
max-line-length = 100
indent-string = "    "  ***REMOVED*** 4 spaces

[tool.pylint.basic]
***REMOVED*** Good variable names
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "f", "e"]

[tool.pylint.design]
max-args = 10  ***REMOVED*** Allow more args (ML models need many params)
max-attributes = 15
max-branches = 15

***REMOVED*** =============================================================================
***REMOVED*** PYTEST CONFIGURATION
***REMOVED*** =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
addopts = """
    -ra
    --strict-markers
    --strict-config
    --dist=loadscope
"""
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
norecursedirs = ["tests/legacy"]
timeout = 30
markers = [
    "unit: Unit tests with mocks (fast, no external deps)",
    "integration: Integration tests (requires Docker/API keys)",
    "slow: Tests taking > 5 seconds",
    "chaos: Chaos/resilience tests (service failures, fallbacks)",
    "load: Load/performance tests (concurrent users, throughput)",
    "e2e: End-to-end pipeline tests (require live services)",
    "smoke: Smoke tests (requires running services)",
    "benchmark: Benchmark tests (parser/reranker comparisons)",
    "legacy_api: tests for pre-LangGraph API (may need rewrite)",
    "requires_extras: Tests needing optional deps (voice/ingest/eval); skipped in core tier",
    "kommo: Live Kommo CRM API tests (requires KOMMO_ACCESS_TOKEN)",
    "xdist_group: Group tests onto same xdist worker (prevents global registry collisions)",
]
filterwarnings = [
    ***REMOVED*** trustcall 0.0.39 imports Send from deprecated langgraph.constants;
    ***REMOVED*** no upstream fix available yet (tracked in ***REMOVED***306)
    "ignore:Importing Send from langgraph:DeprecationWarning",
]

***REMOVED*** =============================================================================
***REMOVED*** COVERAGE CONFIGURATION
***REMOVED*** =============================================================================

[tool.coverage.run]
source = ["src", "telegram_bot"]
branch = true
omit = [
    "*/tests/*",
    "*/legacy/*",
    "*/__pycache__/*",
    "*/.venv/*",
    ***REMOVED*** Scripts directory (not production code)
    "scripts/*",
    "scripts/**/*",
    ***REMOVED*** Evaluation scripts (not production code)
    "src/evaluation/create_golden_set.py",
    "src/evaluation/generate_test_queries.py",
    "src/evaluation/run_ab_test.py",
    "src/evaluation/smoke_test.py",
    "src/evaluation/search_engines_rerank.py",
    "src/evaluation/evaluate_with_ragas.py",
    "src/evaluation/langfuse_integration.py",
    ***REMOVED*** One-off setup scripts
    "telegram_bot/setup_qdrant_indexes.py",
    ***REMOVED*** Test/debug scripts in wrong location
    "telegram_bot/test_*.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
