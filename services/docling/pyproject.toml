[project]
name = "docling-service"
version = "1.0.0"
description = "Docling document parsing service - standalone docling-serve image"
requires-python = ">=3.14"
dependencies = [
    # docling-serve provides the FastAPI HTTP wrapper around the Docling CLI.
    # Pinned to match the root pyproject.toml `docling` optional extra so
    # the service-local lockfile and the root extra resolve to the same
    # docling-serve generation. Keep these in sync.
    "docling-serve[ui]>=1.0.0",
    "starlette>=1.3.1",  # CVE-2026-48817/48818 SSRF fix
    # Keep the Docker image CPU-only. Without explicit direct deps plus
    # [tool.uv.sources], uv resolves PyTorch from PyPI and pulls CUDA packages.
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # Security pin: aiohttp pulled transitively by docling-serve (#2901, 11 CVEs).
    "aiohttp>=3.14.1",
]

[project.optional-dependencies]
# Mirror of the root pyproject.toml `docling` extra; the Dockerfile's
# `uv sync --frozen --no-dev --no-install-project --extra docling` line
# resolves against this extra. Kept identical to the dependencies list
# above so a single dependency change touches both surfaces in one place.
docling = [
    "docling-serve[ui]>=1.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "aiohttp>=3.14.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[tool.uv]
# Version unification (#2902): pin transitive packages to consistent minimums
# where compatible with the docling-serve/docling-core resolution constraints.
# Note: typer, opentelemetry-instrumentation*, docling-core, docling versions
# are intentionally not constrained here — docling-serve pulls conflicting bounds.
constraint-dependencies = [
    "accelerate>=1.14.0",
    "aiohappyeyeballs>=2.6.2",
    "anyio>=4.13.0",
    "attrs>=26.1.0",
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.5.20",
    "charset-normalizer>=3.4.7",
    "click>=8.4.1",
    "dill>=0.4.1",
    "fastapi>=0.136.1",
    "filelock>=3.29.0",
    "fsspec>=2026.2.0",
    "hf-xet>=1.5.0",
    "httptools>=0.7.1",
    "idna>=3.16",
    "importlib-metadata>=8.7.1",
    "markdown-it-py>=4.2.0",
    "marko>=2.2.2",
    "msgpack>=1.1.2",
    "multiprocess>=0.70.19",
    "numpy>=2.4.6",
    "packaging>=26.2",
    "propcache>=0.5.2",
    "protobuf>=6.33.6",
    "regex>=2026.5.9",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "safetensors>=0.7.0",
    "tokenizers>=0.22.2",
    "watchfiles>=1.2.0",
    "yarl>=1.24.2",
    "zipp>=4.1.0",
]
