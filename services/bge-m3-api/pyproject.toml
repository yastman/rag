[project]
name = "bge-m3-api"
version = "1.0.0"
description = "BGE-M3 Embeddings API - FastAPI service"
requires-python = ">=3.11"
dependencies = [
    # Core ML/Embeddings — ONNX INT8 runtime (no PyTorch/FlagEmbedding)
    "onnxruntime>=1.22.0",
    "transformers==5.9.0",
    # FastAPI & Web Server
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "python-multipart==0.0.29",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    # Monitoring & Metrics
    "prometheus-client==0.25.0",
    # Observability
    "langfuse>=4.0.0,<5.0",
    # Utilities
    "numpy==2.4.6",
    "scipy==1.17.1",
    "lxml>=6.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "redis>=7.0",
    "cachetools>=5.0",
    "python-dotenv>=1.0",
    "qdrant-client>=1.17",
    "aiogram>=3.0",
    "langfuse>=4.0.0",
    "langchain-core>=1.2",
]
