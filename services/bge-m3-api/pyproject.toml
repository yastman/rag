[project]
name = "bge-m3-api"
version = "1.0.0"
description = "BGE-M3 Embeddings API - FastAPI service"
requires-python = ">=3.11"
dependencies = [
    # Core ML/Embeddings — ONNX INT8 runtime (no PyTorch/FlagEmbedding)
    "onnxruntime>=1.22.0",
    "transformers==5.12.1",
    # FastAPI & Web Server
    "fastapi==0.136.3",
    "starlette>=1.3.1",  # CVE-2026-48817/48818 SSRF fix
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.31",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    # Monitoring & Metrics
    "prometheus-client==0.25.0",
    # Observability
    "langfuse>=4.0.0,<5.0",
    "opentelemetry-api>=1.39.0",
    # OTEL auto-instrumentation (#2225). FastAPIInstrumentor closes the gap
    # between the manual @app.middleware('http') below and the SDK-native
    # ASGI instrumentation that adds http.* semantic attributes for free.
    # HTTPX/Redis instrumentors trace any outbound calls this service makes
    # in the future (none today, kept for parity).
    "opentelemetry-instrumentation-fastapi>=0.58b0",
    "opentelemetry-instrumentation-httpx>=0.58b0",
    "opentelemetry-instrumentation-logging>=0.58b0",
    # Utilities
    "numpy==2.4.6",
    "scipy==1.17.1",
    "lxml>=6.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "redis>=7.0",
    "cachetools>=5.0",
    "python-dotenv>=1.0",
    "langfuse>=4.0.0",
    # Removed: qdrant-client, aiogram, langchain-core — no test files exist
    # in this service directory; these were stale deps (#2710).
]

[tool.uv]
# Version unification (#2902): pin transitive packages to consistent minimums.
constraint-dependencies = [
    "anyio>=4.13.0",
    "certifi>=2026.5.20",
    "charset-normalizer>=3.4.7",
    "click>=8.4.1",
    "filelock>=3.29.3",
    "fsspec>=2026.4.0",
    "hf-xet>=1.5.1",
    "httptools>=0.8.0",
    "huggingface-hub>=1.19.0",
    "idna>=3.16",
    "importlib-metadata>=8.9.0",
    "markdown-it-py>=4.2.0",
    "onnxruntime>=1.27.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-exporter-otlp-proto-common>=1.41.1",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
    "opentelemetry-instrumentation>=0.62b1",
    "opentelemetry-instrumentation-asgi>=0.62b1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-proto>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-semantic-conventions>=0.62b1",
    "opentelemetry-util-http>=0.62b1",
    "packaging>=26.2",
    "pytest-asyncio>=1.4.0",
    "regex>=2026.5.9",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "safetensors>=0.8.0",
    "typer>=0.25.1",
    "watchfiles>=1.2.0",
    "zipp>=4.1.0",
    "cachetools>=7.1.4",
]
