[project]
name = "bge-m3-api"
version = "1.0.0"
description = "BGE-M3 Embeddings API - FastAPI service"
requires-python = ">=3.11"
dependencies = [
    ***REMOVED*** Core ML/Embeddings
    "FlagEmbedding==1.4.0",
    "torch==2.12.0+cpu",
    "transformers==4.57.6",
    "sentence-transformers==3.4.1",
    ***REMOVED*** FastAPI & Web Server
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "python-multipart==0.0.29",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    ***REMOVED*** Monitoring & Metrics
    "prometheus-client==0.25.0",
    ***REMOVED*** Observability
    "langfuse>=4.0.0,<5.0",
    ***REMOVED*** Utilities
    "numpy==2.4.6",
    "scipy==1.17.1",
    "lxml>=6.1.0",
]

[tool.uv]
***REMOVED*** Use PyPI as default, PyTorch CPU index only for torch packages
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
