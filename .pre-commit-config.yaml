***REMOVED*** Pre-commit hooks configuration for contextual_rag project
***REMOVED*** Install: pip install pre-commit
***REMOVED*** Setup: pre-commit install --install-hooks
***REMOVED*** Setup pre-push: pre-commit install --hook-type pre-push
***REMOVED*** Run manually: pre-commit run --all-files
***REMOVED***
***REMOVED*** Documentation: https://pre-commit.com/

default_language_version:
  python: python3.12  ***REMOVED*** Updated to match installed Python version

***REMOVED*** Install both pre-commit and pre-push hooks by default
default_install_hook_types:
  - pre-commit
  - pre-push

***REMOVED*** Default stages for hooks (can be overridden per hook)
default_stages:
  - pre-commit

repos:
  ***REMOVED*** Ruff - Modern Python linter and formatter (replaces flake8, black, isort)
  ***REMOVED*** Best Practice 2025: Run linter BEFORE formatter (lint → format order)
  ***REMOVED*** Documentation: https://docs.astral.sh/ruff/integrations/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13  ***REMOVED*** Latest: https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      ***REMOVED*** Step 1: Linter - checks code quality (runs FIRST)
      - id: ruff-check
        name: Ruff Linter (check + fix)
        args:
          - --fix           ***REMOVED*** Auto-fix issues when possible
          - --exit-non-zero-on-fix  ***REMOVED*** Fail if fixes were applied (to review changes)
        types_or: [python, pyi]
        exclude: ^legacy/

      ***REMOVED*** Step 2: Formatter - formats code (runs AFTER linting)
      - id: ruff-format
        name: Ruff Formatter
        types_or: [python, pyi]
        exclude: ^legacy/

  ***REMOVED*** Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  ***REMOVED*** Latest: https://github.com/pre-commit/pre-commit-hooks/releases
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']  ***REMOVED*** Allow custom YAML tags
      - id: check-toml
        name: Check TOML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: debug-statements
        name: Check for debugger imports
      - id: mixed-line-ending
        name: Check mixed line endings
        args: ['--fix=lf']

  ***REMOVED*** Optional: mypy for type checking
  ***REMOVED*** Uncomment to enable strict type checking
  ***REMOVED*** - repo: https://github.com/pre-commit/mirrors-mypy
  ***REMOVED***   rev: v1.13.0
  ***REMOVED***   hooks:
  ***REMOVED***     - id: mypy
  ***REMOVED***       name: MyPy Type Checker
  ***REMOVED***       additional_dependencies:
  ***REMOVED***         - types-requests
  ***REMOVED***         - types-aiohttp
  ***REMOVED***       args:
  ***REMOVED***         - --config-file=pyproject.toml

  ***REMOVED*** Optional: bandit for security issues
  ***REMOVED*** Uncomment to enable security scanning
  ***REMOVED*** - repo: https://github.com/PyCQA/bandit
  ***REMOVED***   rev: '1.7.10'
  ***REMOVED***   hooks:
  ***REMOVED***     - id: bandit
  ***REMOVED***       name: Bandit Security Linter
  ***REMOVED***       args:
  ***REMOVED***         - -c
  ***REMOVED***         - pyproject.toml
  ***REMOVED***       additional_dependencies: ["bandit[toml]"]

  ***REMOVED*** =============================================================================
  ***REMOVED*** PRE-PUSH HOOKS (Run before git push)
  ***REMOVED*** =============================================================================
  ***REMOVED*** These hooks run more expensive checks that shouldn't slow down commits

  ***REMOVED*** Run tests before push (if you have tests)
  ***REMOVED*** Uncomment when tests are available
  ***REMOVED*** - repo: local
  ***REMOVED***   hooks:
  ***REMOVED***     - id: pytest
  ***REMOVED***       name: Run pytest
  ***REMOVED***       entry: pytest
  ***REMOVED***       language: system
  ***REMOVED***       pass_filenames: false
  ***REMOVED***       stages: [pre-push]

  ***REMOVED*** Prevent pushing to main/master branches accidentally
  - repo: local
    hooks:
      - id: branch-protection
        name: Protect main/master branch
        entry: bash -c 'BRANCH=$(git rev-parse --abbrev-ref HEAD); if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then echo "⚠️  Direct push to $BRANCH is not recommended. Use a feature branch."; exit 0; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

***REMOVED*** CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
