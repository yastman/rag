***REMOVED*** Pre-commit hooks configuration for contextual_rag project
***REMOVED*** Install: uv add pre-commit --dev && uv run pre-commit install
***REMOVED*** Setup pre-push: uv run pre-commit install --hook-type pre-push
***REMOVED*** Run manually: uv run pre-commit run --all-files
***REMOVED*** VPS: /srv/.local/pre-commit-venv/bin/pre-commit run --all-files
***REMOVED***
***REMOVED*** Documentation: https://pre-commit.com/

default_language_version:
  python: python3.12  ***REMOVED*** Updated to match installed Python version

***REMOVED*** Install both pre-commit and pre-push hooks by default
default_install_hook_types:
  - pre-commit
  - pre-push

***REMOVED*** Default stages for hooks (can be overridden per hook)
default_stages:
  - pre-commit

fail_fast: true  ***REMOVED*** Stop on first failure (performance)

repos:
  ***REMOVED*** Ruff - Modern Python linter and formatter (replaces flake8, black, isort)
  ***REMOVED*** Best Practice 2025: Run linter BEFORE formatter (lint → format order)
  ***REMOVED*** Documentation: https://docs.astral.sh/ruff/integrations/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11  ***REMOVED*** Latest: https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      ***REMOVED*** Step 1: Linter - checks code quality (runs FIRST)
      - id: ruff-check
        name: Ruff Linter (check + fix)
        args:
          - --fix           ***REMOVED*** Auto-fix issues when possible
          - --exit-non-zero-on-fix  ***REMOVED*** Fail if fixes were applied (to review changes)
        types_or: [python, pyi]
        exclude: ^legacy/

      ***REMOVED*** Step 2: Formatter - formats code (runs AFTER linting)
      - id: ruff-format
        name: Ruff Formatter
        types_or: [python, pyi]
        exclude: ^legacy/

  ***REMOVED*** Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  ***REMOVED*** Latest: https://github.com/pre-commit/pre-commit-hooks/releases
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']  ***REMOVED*** Allow custom YAML tags
      - id: check-toml
        name: Check TOML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: debug-statements
        name: Check for debugger imports
      - id: mixed-line-ending
        name: Check mixed line endings
        args: ['--fix=lf']

  ***REMOVED*** Optional: mypy for type checking
  ***REMOVED*** Uncomment to enable strict type checking
  ***REMOVED*** - repo: https://github.com/pre-commit/mirrors-mypy
  ***REMOVED***   rev: v1.13.0
  ***REMOVED***   hooks:
  ***REMOVED***     - id: mypy
  ***REMOVED***       name: MyPy Type Checker
  ***REMOVED***       additional_dependencies:
  ***REMOVED***         - types-requests
  ***REMOVED***         - types-aiohttp
  ***REMOVED***       args:
  ***REMOVED***         - --config-file=pyproject.toml

  ***REMOVED*** Optional: bandit for security issues
  ***REMOVED*** Uncomment to enable security scanning
  ***REMOVED*** - repo: https://github.com/PyCQA/bandit
  ***REMOVED***   rev: '1.7.10'
  ***REMOVED***   hooks:
  ***REMOVED***     - id: bandit
  ***REMOVED***       name: Bandit Security Linter
  ***REMOVED***       args:
  ***REMOVED***         - -c
  ***REMOVED***         - pyproject.toml
  ***REMOVED***       additional_dependencies: ["bandit[toml]"]

  ***REMOVED*** =============================================================================
  ***REMOVED*** PRE-PUSH HOOKS (Run before git push)
  ***REMOVED*** =============================================================================
  ***REMOVED*** These hooks run more expensive checks that shouldn't slow down commits

  ***REMOVED*** Block direct commits to main — only merge from dev allowed.
  ***REMOVED*** git merge doesn't trigger pre-commit stage, so merges pass through.
  - repo: local
    hooks:
      - id: no-commit-to-main
        name: Block direct commits to main
        entry: ./scripts/no-commit-to-main.sh
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: MyPy Type Checker
        entry: uv run mypy src/ telegram_bot/ --ignore-missing-imports --no-error-summary
        language: system
        pass_filenames: false
        stages: [pre-push]

***REMOVED*** CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
