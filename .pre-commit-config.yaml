# Pre-commit hooks configuration for contextual_rag project
# Install: uv add pre-commit --dev && uv run pre-commit install
# Setup pre-push: uv run pre-commit install --hook-type pre-push
# Run manually: uv run pre-commit run --all-files
# VPS: /srv/.local/pre-commit-venv/bin/pre-commit run --all-files
#
# Documentation: https://pre-commit.com/

default_language_version:
  python: python3.12  # Updated to match installed Python version

# Install both pre-commit and pre-push hooks by default
default_install_hook_types:
  - pre-commit
  - pre-push

# Default stages for hooks (can be overridden per hook)
default_stages:
  - pre-commit

fail_fast: true  # Stop on first failure (performance)

repos:
  # =============================================================================
  # PRE-COMMIT HOOKS (Run before every commit - must be fast)
  # =============================================================================

  # Local hooks - syntax and schema validation
  - repo: local
    hooks:
      - id: python-syntax-check
        name: Python syntax check (py_compile)
        entry: python3 -m py_compile
        language: system
        types: [python]
        stages: [pre-commit]

      - id: check-done-json
        name: Validate DONE JSON schema
        entry: python3 scripts/validate_done_json.py
        language: system
        files: '\.done\.json$'
        stages: [pre-push]

  # Ruff - Modern Python linter and formatter (replaces flake8, black, isort)
  # Best Practice 2025: Run linter BEFORE formatter (lint -> format order)
  # Documentation: https://docs.astral.sh/ruff/integrations/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12  # Latest: https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      # Step 1: Linter - checks code quality (runs FIRST)
      - id: ruff-check
        name: Ruff Linter (check + fix)
        args:
          - --fix           # Auto-fix issues when possible
          - --exit-non-zero-on-fix  # Fail if fixes were applied (to review changes)
        types_or: [python, pyi]
        stages: [pre-commit]

      # Step 2: Formatter - formats code (runs AFTER linting)
      - id: ruff-format
        name: Ruff Formatter
        types_or: [python, pyi]
        stages: [pre-commit]

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # Latest: https://github.com/pre-commit/pre-commit-hooks/releases
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        name: Fix end of files
        stages: [pre-commit]
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']  # Allow custom YAML tags
        stages: [pre-commit]
      - id: check-toml
        name: Check TOML syntax
        stages: [pre-commit]
      - id: check-json
        name: Check JSON syntax
        stages: [pre-commit]
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
        stages: [pre-commit]
      - id: check-merge-conflict
        name: Check for merge conflicts
        stages: [pre-commit]
      - id: detect-private-key
        name: Detect private keys
        stages: [pre-commit]
      - id: debug-statements
        name: Check for debugger imports
        stages: [pre-commit]
      - id: mixed-line-ending
        name: Check mixed line endings
        args: ['--fix=lf']
        stages: [pre-commit]
      - id: check-case-conflict
        name: Check case conflicts
        stages: [pre-commit]
      - id: check-symlinks
        name: Check symlinks
        stages: [pre-commit]
      - id: destroyed-symlinks
        name: Detect destroyed symlinks
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        name: Check executables have shebangs
        stages: [pre-commit]
      - id: no-commit-to-branch
        name: Prevent commits to main/dev
        args: ['--branch', 'main', '--branch', 'dev']
        stages: [pre-commit]

  # Gitleaks for secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Gitleaks secret scanner
        stages: [pre-commit]

  # =============================================================================
  # PRE-PUSH HOOKS (Run before git push - heavier checks)
  # =============================================================================

  # Bandit for security issues
  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.4'
    hooks:
      - id: bandit
        name: Bandit Security Linter
        exclude: ^scripts/archive/
        args:
          - -c
          - pyproject.toml
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-push]

  # actionlint for GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        name: actionlint
        stages: [pre-push]

  # shellcheck for shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: shellcheck
        stages: [pre-push]

  # Hadolint for Dockerfile linting (Python wrapper, no Docker required)
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.12.0.3
    hooks:
      - id: hadolint
        name: Hadolint Dockerfile linter
        stages: [pre-push]
        files: Dockerfile.*|.*Dockerfile
        args: [--failure-threshold, error]

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
