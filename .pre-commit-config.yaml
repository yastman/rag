***REMOVED*** Pre-commit hooks configuration for contextual_rag project
***REMOVED*** Install: uv add pre-commit --dev && uv run pre-commit install
***REMOVED*** Setup pre-push: uv run pre-commit install --hook-type pre-push
***REMOVED*** Run manually: uv run pre-commit run --all-files
***REMOVED*** VPS: /srv/.local/pre-commit-venv/bin/pre-commit run --all-files
***REMOVED***
***REMOVED*** Documentation: https://pre-commit.com/

default_language_version:
  python: python3.14  ***REMOVED*** Updated to match installed Python version

***REMOVED*** Install both pre-commit and pre-push hooks by default
default_install_hook_types:
  - pre-commit
  - pre-push

***REMOVED*** Default stages for hooks (can be overridden per hook)
default_stages:
  - pre-commit

fail_fast: true  ***REMOVED*** Stop on first failure (performance)

repos:
  ***REMOVED*** =============================================================================
  ***REMOVED*** PRE-COMMIT HOOKS (Run before every commit - must be fast)
  ***REMOVED*** =============================================================================

  ***REMOVED*** Ruff - Modern Python linter and formatter (replaces flake8, black, isort)
  ***REMOVED*** Best Practice 2025: Run linter BEFORE formatter (lint -> format order)
  ***REMOVED*** Documentation: https://docs.astral.sh/ruff/integrations/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12  ***REMOVED*** Latest: https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      ***REMOVED*** Step 1: Linter - checks code quality (runs FIRST)
      - id: ruff-check
        name: Ruff Linter (check + fix)
        args:
          - --fix           ***REMOVED*** Auto-fix issues when possible
          - --exit-non-zero-on-fix  ***REMOVED*** Fail if fixes were applied (to review changes)
        types_or: [python, pyi]
        exclude: ^legacy/
        stages: [pre-commit]

      ***REMOVED*** Step 2: Formatter - formats code (runs AFTER linting)
      - id: ruff-format
        name: Ruff Formatter
        types_or: [python, pyi]
        exclude: ^legacy/
        stages: [pre-commit]

  ***REMOVED*** Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  ***REMOVED*** Latest: https://github.com/pre-commit/pre-commit-hooks/releases
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        name: Fix end of files
        stages: [pre-commit]
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']  ***REMOVED*** Allow custom YAML tags
        stages: [pre-commit]
      - id: check-toml
        name: Check TOML syntax
        stages: [pre-commit]
      - id: check-json
        name: Check JSON syntax
        stages: [pre-commit]
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
        stages: [pre-commit]
      - id: check-merge-conflict
        name: Check for merge conflicts
        stages: [pre-commit]
      - id: detect-private-key
        name: Detect private keys
        stages: [pre-commit]
      - id: debug-statements
        name: Check for debugger imports
        stages: [pre-commit]
      - id: mixed-line-ending
        name: Check mixed line endings
        args: ['--fix=lf']
        stages: [pre-commit]
      - id: check-case-conflict
        name: Check case conflicts
        stages: [pre-commit]
      - id: check-symlinks
        name: Check symlinks
        stages: [pre-commit]
      - id: destroyed-symlinks
        name: Detect destroyed symlinks
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        name: Check executables have shebangs
        stages: [pre-commit]
      - id: check-shebang-scripts-are-executable
        name: Check shebang scripts are executable
        stages: [pre-commit]
      - id: no-commit-to-branch
        name: Prevent commits to main/dev
        args: ['--branch', 'main', '--branch', 'dev']
        stages: [pre-commit]

  ***REMOVED*** Gitleaks for secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Gitleaks secret scanner
        stages: [pre-commit]

  ***REMOVED*** =============================================================================
  ***REMOVED*** PRE-PUSH HOOKS (Run before git push - heavier checks)
  ***REMOVED*** =============================================================================

  ***REMOVED*** Bandit for security issues
  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.4'
    hooks:
      - id: bandit
        name: Bandit Security Linter
        exclude: ^scripts/archive/
        args:
          - -c
          - pyproject.toml
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-push]

  ***REMOVED*** actionlint for GitHub Actions workflow linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        name: actionlint
        stages: [pre-push]

  ***REMOVED*** shellcheck for shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: shellcheck
        stages: [pre-push]

  ***REMOVED*** Hadolint for Dockerfile linting (Python wrapper, no Docker required)
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.12.0.3
    hooks:
      - id: hadolint
        name: Hadolint Dockerfile linter
        stages: [pre-push]
        files: Dockerfile.*|.*Dockerfile
        args: [--failure-threshold, error]

***REMOVED*** CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
