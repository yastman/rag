***REMOVED*** Qdrant storage optimisation config — loaded as /qdrant/config/production.yaml
***REMOVED*** Addresses issue ***REMOVED***1545: gdrive_documents_bge vectors accumulated 3.1 GB
***REMOVED*** unbounded because Qdrant shipped with all-default (RAM-heavy) settings.
***REMOVED***
***REMOVED*** Context7 / Qdrant documentation baseline (content rephrased for compliance
***REMOVED*** with licensing restrictions):
***REMOVED***   on_disk_payload – when true, point payloads that are NOT required for
***REMOVED***     active filters are persisted to disk rather than kept in RAM.  Indexed
***REMOVED***     payload fields still reside in memory.  This trades a small read-latency
***REMOVED***     cost for a significant reduction in resident-set size, which is the
***REMOVED***     primary driver of the 3.1 GB volume seen on dev (***REMOVED***1545).
***REMOVED***   optimizers.indexing_threshold_kb – maximum total size (in kB) of
***REMOVED***     unindexed vectors that Qdrant will hold in a plain segment before it
***REMOVED***     triggers HNSW graph construction.  The default of 20 000 kB (≈ 20 MB)
***REMOVED***     is a good balance: ingestion remains fast while segments are rebuilt
***REMOVED***     opportunistically, avoiding the "deferred-forever" scenario caused by
***REMOVED***     setting this to 0.
***REMOVED***
***REMOVED*** Operator notes:
***REMOVED***   • After deploying this config, restart the Qdrant container so it picks up
***REMOVED***     the file:
***REMOVED***       docker compose restart qdrant
***REMOVED***   • Existing collection on_disk_payload is stored per-collection in the WAL.
***REMOVED***     For the change to take effect on gdrive_documents_bge, recreate the
***REMOVED***     collection OR patch it via the REST API:
***REMOVED***       PATCH http://qdrant:6333/collections/gdrive_documents_bge
***REMOVED***       {"on_disk_payload": true}
***REMOVED***   • Use `make qdrant-cleanup` to take a snapshot and prune old segments.

storage:
  ***REMOVED*** Move non-filtered payloads from RAM to disk (primary fix for ***REMOVED***1545).
  on_disk_payload: true

  optimizers:
    ***REMOVED*** Trigger HNSW index construction once an unindexed segment exceeds
    ***REMOVED*** 20 MB.  Set to 0 only during bulk-ingest to defer indexing overhead,
    ***REMOVED*** then restore this value so the graph is eventually built.
    indexing_threshold_kb: 20000
