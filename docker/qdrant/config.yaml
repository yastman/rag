# Qdrant storage optimization config — issue #1545
# Mounted read-only at /qdrant/config/config.yaml inside the container.
# Reduces RAM usage and prevents unbounded vector accumulation.
#
# compose.yml wires this via:
#   volumes:
#     - ./docker/qdrant/config.yaml:/qdrant/config/config.yaml:ro
#
# References:
#   https://qdrant.tech/documentation/guides/configuration/

storage:
  # Store payload data on disk instead of RAM (issue #1545).
  # Significantly reduces memory footprint when payloads are large.
  on_disk_payload: true

  # HNSW graph index settings
  hnsw_index:
    # Number of bi-directional links per node (default: 16).
    # Lower = less RAM + faster builds; higher = better recall.
    m: 16
    # Search candidates during graph construction.
    # Higher = better recall, slower build time.
    ef_construct: 100
    # Keep the default full-scan threshold unless collection-specific
    # benchmarking proves a different value is needed.
    full_scan_threshold_kb: 10000

  performance:
    # Maximum size (in KiB) of vectors allowed for plain index.
    # Reduces overhead from very small segments.
    indexing_threshold_kb: 20000

# Disable anonymous telemetry for self-hosted deployments.
telemetry_disabled: true
