***REMOVED*** LiteLLM Proxy Configuration
***REMOVED*** Docs: https://docs.litellm.ai/docs/proxy/configs
***REMOVED*** Image: ghcr.io/berriai/litellm:main-v1.81.0-stable

model_list:
  ***REMOVED*** Primary: Cerebras zai-glm-4.7 via OpenAI-compatible API
  ***REMOVED*** ALIAS: "gpt-4o-mini" is an internal alias — it does NOT call OpenAI.
  ***REMOVED*** The bot sends requests to "gpt-4o-mini" which LiteLLM routes to Cerebras.
  ***REMOVED*** See fallbacks below for the actual OpenAI fallback (gpt-4o-mini-openai).
  ***REMOVED*** merge_reasoning_content: zai-glm-4.7 is a reasoning model that sends
  ***REMOVED*** tokens as delta.reasoning instead of delta.content — this flag merges them
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/zai-glm-4.7
      api_base: https://api.cerebras.ai/v1
      api_key: os.environ/CEREBRAS_API_KEY
      merge_reasoning_content_in_choices: true

  ***REMOVED*** Fallback 1: Groq (fast, free tier)
  - model_name: gpt-4o-mini-fallback
    litellm_params:
      model: groq/llama-3.1-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  ***REMOVED*** Fallback 2: OpenAI (reliable)
  - model_name: gpt-4o-mini-openai
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

***REMOVED*** Production general settings
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  proxy_batch_write_at: 60
  disable_error_logs: true
  allow_requests_on_db_unavailable: true

***REMOVED*** Automatic fallback on errors
router_settings:
  fallbacks:
    - gpt-4o-mini: [gpt-4o-mini-fallback, gpt-4o-mini-openai]
  retry_policy:
    retry_count: 2

***REMOVED*** LiteLLM settings
litellm_settings:
  request_timeout: 600
  set_verbose: false
  json_logs: true

***REMOVED*** Environment variables for Langfuse v3
environment_variables:
  LANGFUSE_PUBLIC_KEY: os.environ/LANGFUSE_PUBLIC_KEY
  LANGFUSE_SECRET_KEY: os.environ/LANGFUSE_SECRET_KEY
  LANGFUSE_HOST: os.environ/LANGFUSE_HOST
  LANGFUSE_OTEL_HOST: os.environ/LANGFUSE_OTEL_HOST
