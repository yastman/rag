[project]
name = "rag-telegram-bot"
version = "0.1.0"
description = "RAG Telegram Bot with hybrid search"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.29.0",
    "aiogram-dialog>=2.4.0",
    "httpx>=0.28.0",
    "qdrant-client>=1.18.0",  # v1.18+ unified pin (telegram_bot pyproject)
    # grpcio is intentionally NOT declared directly (#2241). qdrant-client
    # pins grpcio>=1.41.0 as a hard dependency, so the Qdrant gRPC transport
    # (prefer_grpc=True) keeps it available transitively. A redundant direct
    # pin only triggers extra resolver/build work in PR checks.
    "redis>=5.0.0",
    "redisvl>=0.3.0",
    "tenacity>=8.2.0",
    "cachetools>=5.3.0",
    "python-dotenv>=1.0.0",
    "openai>=1.10.0",
    "litellm>=1.0.0",
    # #3228: pydantic is imported directly by telegram_bot code (config.py,
    # agents/retrieve_tool.py, services/crm/lead_scoring_models.py,
    # services/handoff_state.py) — declared explicitly instead of relying on
    # the transitive pydantic pulled by pydantic-settings/litellm.
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "fluentogram>=1.1.8",
    "fluent-compiler>=1.1",
    "asyncpg>=0.31.0",
    "phonenumbers>=9.0.30",
    # Security pin: aiohttp pulled transitively by aiogram (#2901, 11 CVEs).
    "aiohttp>=3.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["telegram_bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Version unification (#2902): pin transitive packages to consistent minimums.
constraint-dependencies = [
    "aiohappyeyeballs>=2.6.2",
    "anyio>=4.13.0",
    "attrs>=26.1.0",
    "certifi>=2026.5.20",
    "charset-normalizer>=3.4.7",
    "click>=8.4.1",
    "filelock>=3.29.3",
    "fsspec>=2026.4.0",
    "grpcio>=1.80.0",
    "hf-xet>=1.5.1",
    "huggingface-hub>=1.19.0",
    "idna>=3.16",
    "importlib-metadata>=8.9.0",
    "jiter>=0.13.0",
    "jsonpath-ng>=1.8.0",
    "markdown-it-py>=4.2.0",
    "numpy>=2.4.6",
    "packaging>=26.2",
    "propcache>=0.5.2",
    "protobuf>=6.33.6",
    "regex>=2026.5.9",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rpds-py>=2026.5.1",
    "tiktoken>=0.13.0",
    "tokenizers>=0.23.1",
    "typer>=0.25.1",
    "yarl>=1.24.2",
    "zipp>=4.1.0",
    "openai>=2.37.0",
    "redisvl>=0.18.2",
]
