services:
  qdrant:
    image: qdrant/qdrant@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis@sha256:c25154ff5e2e6d0820a0268abd9dd3bc84f48fddd40396fb1f4de5b3dcc2182a
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  bge-m3:
    build:
      context: ./sidecar/bge-m3
      args:
        PYTHON_BASE: python:3.12.12-slim@sha256:f3fa41d74a768c2fce8016b98c191ae8c1bacd8f1152870a3f9f87d350920b7c
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  qdrant_data:
  redis_data:
