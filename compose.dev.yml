# compose.dev.yml — Development overrides: ports, colbert reranking, ML profile-gating.
# Usage: COMPOSE_FILE=compose.yml:compose.dev.yml docker compose up -d
#
# Docker credentials must come from .env or an explicit --env-file. The make
# targets fall back to tests/fixtures/compose.ci.env when .env is absent.

services:
  postgres:
    # Local pgvector startup needs these while initializing/fixing ownership on
    # the mounted data and runtime directories. Keep this scoped to dev only.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy volatile-lfu
      --maxmemory-samples 10
      --save ""
      --stop-writes-on-bgsave-error no

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

  bge-m3:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-bge-m3}"
    deploy:
      resources:
        limits:
          memory: ${BGE_M3_MEMORY_LIMIT:-4G}

  docling:
    ports:
      - "127.0.0.1:5001:5001"


  bot:
    profiles: ["bot", "full"]
    environment:
      RERANK_PROVIDER: colbert
      RERANK_CANDIDATES_MAX: "${RERANK_CANDIDATES_MAX:-10}"
      COLBERT_TIMEOUT: "${COLBERT_TIMEOUT:-120}"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}

  # ML services — profile-gated on dev (VPS: always-on via compose.yml base)
  clickhouse:
    profiles: ["ml", "full"]
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9009:9000"
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}

  minio:
    profiles: ["ml", "full"]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9090}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9091}:9001"
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

  redis-langfuse:
    profiles: ["ml", "full"]
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --requirepass ${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  langfuse-worker:
    profiles: ["ml", "full"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD is required}

  langfuse:
    profiles: ["ml", "full"]
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-dev-org}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Local Dev}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-dev-project}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-Local Dev}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-sk-lf-dev}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD is required}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1536}
    deploy:
      resources:
        limits:
          memory: 2G

  ingestion:
    profiles: ["ingest", "full"]
    environment:
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-dev}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-dev}
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-ingestion}"

  # loki, alertmanager archived — see archive/obs/
